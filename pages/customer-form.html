<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيانات العميل - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body class="booting">
<main id="page-content" hidden>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="page-title" id="title">إضافة عميل جديد</h1>
    <a class="btn btn-outline-secondary btn-sm" href="customers.html"><i class="bi bi-arrow-right ms-1"></i>العودة للعملاء</a>
  </div>

  <div id="alertBox" class="alert alert-danger" hidden></div>

  <form id="customerForm" class="panel p-3 p-md-4" novalidate>
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label" for="name">اسم العميل <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="name" name="name" placeholder="مثال: أحمد محمد علي" required autocomplete="off">
        <div class="invalid-feedback" id="err_name"></div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="phone">رقم الهاتف الأساسي <span class="text-danger">*</span></label>
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="01012345678" dir="ltr" required autocomplete="off">
        <div class="invalid-feedback" id="err_phone"></div>
        <div class="form-text">يُطبَّع الرقم تلقائيًا ويُمنع تكراره مع أي عميل آخر.</div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="phone2">رقم هاتف إضافي (اختياري)</label>
        <input type="tel" class="form-control" id="phone2" name="phone2" placeholder="01112345678" dir="ltr" autocomplete="off">
        <div class="invalid-feedback" id="err_phone2"></div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="whatsapp">رقم واتساب (اختياري)</label>
        <div class="input-group">
          <input type="tel" class="form-control" id="whatsapp" name="whatsapp" placeholder="01012345678" dir="ltr" autocomplete="off">
          <button class="btn btn-outline-secondary" type="button" id="copyPhoneToWa" title="نسخ الهاتف الأساسي">نفس الأساسي</button>
          <div class="invalid-feedback" id="err_whatsapp"></div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label" for="customerType">تصنيف العميل</label>
        <select class="form-select" id="customerType" name="customerType"></select>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label" for="status">حالة العميل</label>
        <select class="form-select" id="status" name="status"></select>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label" for="source">مصدر العميل</label>
        <select class="form-select" id="source" name="source"></select>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="city">المدينة / المنطقة (اختياري)</label>
        <input type="text" class="form-control" id="city" name="city" placeholder="مثال: الخانكة، العبور، مدينة نصر..." autocomplete="off">
      </div>

      <div class="col-12">
        <label class="form-label" for="notes">ملاحظات عامة عن العميل</label>
        <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="أضف أي ملاحظات مهمة عن اهتمامات العميل، الميزانية التقريبية، أو مواعيد الاتصال المفضلة..."></textarea>
      </div>
    </div>

    <div class="sticky-save mt-4 pt-3 border-top">
      <button type="submit" class="btn btn-navy" id="saveBtn"><i class="bi bi-check2-circle ms-1"></i>حفظ بيانات العميل</button>
      <a class="btn btn-link text-decoration-none" id="cancelBtn" href="customers.html">إلغاء</a>
    </div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/customer-form.js"></script>
</body>
</html>
