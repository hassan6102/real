<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المفضلة - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body class="booting">
<main id="page-content" hidden>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="page-title">المفضلة</h1><span id="count" class="text-muted small"></span>
  </div>
  <div class="fsec mb-3"><div class="row g-2">
    <div class="col-12 col-lg-4"><input type="search" id="q" class="form-control" placeholder="بحث بالكود أو المنطقة أو المدينة..." autocomplete="off"></div>
    <div class="col-6 col-lg-2"><select id="fTx" class="form-select"></select></div>
    <div class="col-6 col-lg-2"><select id="fType" class="form-select"></select></div>
    <div class="col-6 col-lg-2"><select id="fStatus" class="form-select"></select></div>
    <div class="col-6 col-lg-2"><button id="reset" type="button" class="btn btn-outline-secondary w-100">إعادة ضبط</button></div>
  </div></div>
  <div id="err" class="alert alert-danger" hidden>تعذّر تحميل المفضلة.</div>
  <div class="row g-3" id="list"><div class="text-muted">جارٍ التحميل...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/favorites.js"></script>
</body>
</html>
