<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطابقة العقارات - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body class="booting">
<main id="page-content" hidden>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="page-title">مطابقة العقارات</h1>
    <div class="d-flex align-items-center gap-2">
      <label for="minScore" class="small text-muted mb-0">أقل نسبة توافق</label>
      <select id="minScore" class="form-select form-select-sm" style="width:auto">
        <option value="40">40%</option><option value="50" selected>50%</option><option value="60">60%</option><option value="70">70%</option><option value="80">80%</option>
      </select>
    </div>
  </div>
  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" id="tabReq" data-bs-toggle="tab" data-bs-target="#paneReq" type="button" role="tab">حسب طلب العميل</button></li>
    <li class="nav-item"><button class="nav-link" id="tabProp" data-bs-toggle="tab" data-bs-target="#paneProp" type="button" role="tab">حسب العقار</button></li>
  </ul>
  <div id="loadError" class="alert alert-warning" hidden>تعذّر تحميل البيانات. تحقق من الاتصال والصلاحيات ونشر الفهارس.</div>
  <div id="limitNote" class="alert alert-info small" hidden></div>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="paneReq" role="tabpanel">
      <div class="row g-3">
        <div class="col-12 col-lg-4">
          <input type="search" id="reqSearch" class="form-control mb-2" placeholder="بحث باسم العميل أو الهاتف أو كود الطلب..." autocomplete="off">
          <div id="reqList" class="pick-list"><div class="text-muted">جارٍ التحميل...</div></div>
        </div>
        <div class="col-12 col-lg-8"><div id="reqResults"><div class="empty panel"><i class="bi bi-diagram-3"></i><p>اختر طلب عميل لعرض العقارات المناسبة له.</p></div></div></div>
      </div>
    </div>
    <div class="tab-pane fade" id="paneProp" role="tabpanel">
      <div class="row g-3">
        <div class="col-12 col-lg-4">
          <input type="search" id="propSearch" class="form-control mb-2" placeholder="بحث بكود العقار أو المنطقة..." autocomplete="off">
          <div id="propList" class="pick-list"><div class="text-muted">جارٍ التحميل...</div></div>
        </div>
        <div class="col-12 col-lg-8"><div id="propResults"><div class="empty panel"><i class="bi bi-people"></i><p>اختر عقارًا لعرض العملاء المحتمل اهتمامهم به.</p></div></div></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="contactForm" novalidate>
      <div class="modal-header"><h2 class="modal-title fs-5">تسجيل نتيجة التواصل</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button></div>
      <div class="modal-body">
        <p class="small text-muted" id="cmContext"></p>
        <div class="row g-2">
          <div class="col-6"><label class="form-label" for="cmType">وسيلة التواصل</label><select id="cmType" class="form-select"></select></div>
          <div class="col-6"><label class="form-label" for="cmOutcome">النتيجة</label><select id="cmOutcome" class="form-select"></select></div>
          <div class="col-6"><label class="form-label" for="cmDate">تاريخ التواصل</label><input type="date" id="cmDate" class="form-control"></div>
          <div class="col-6"><label class="form-label" for="cmNext">موعد المتابعة التالية</label><input type="date" id="cmNext" class="form-control"></div>
          <div class="col-12"><label class="form-label" for="cmStatus">تحديث حالة الطلب (اختياري)</label><select id="cmStatus" class="form-select"></select></div>
          <div class="col-12"><label class="form-label" for="cmNotes">ملخص التواصل</label><textarea id="cmNotes" class="form-control" rows="3" required></textarea><div class="invalid-feedback">اكتب ملخص التواصل.</div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button><button type="submit" id="cmSave" class="btn btn-navy">حفظ</button></div>
    </form></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/matching.js"></script>
</body>
</html>
