<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>البحث المتقدم - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body class="booting">
<main id="page-content" hidden>
  <h1 class="page-title mb-3">البحث المتقدم</h1>
  <form id="form" novalidate>
    <button type="button" class="btn btn-outline-secondary mb-2 d-lg-none" data-bs-toggle="collapse" data-bs-target="#filters"><i class="bi bi-funnel ms-1"></i>الفلاتر</button>
    <div class="collapse" id="filters"><div class="row g-3" id="fields"></div>
      <p class="small text-muted mt-2 mb-0">العقار الذي لم تُسجَّل فيه القيمة لا يظهر عند استخدام الفلتر الخاص بها.</p></div>
    <div class="sticky-save"><button id="go" class="btn btn-navy"><span id="spin" class="spinner-border spinner-border-sm ms-1" hidden></span>بحث</button>
      <button type="button" id="reset" class="btn btn-outline-secondary">إعادة ضبط الفلاتر</button>
      <button type="button" id="save" class="btn btn-gold">حفظ البحث</button></div>
  </form>
  <details class="mb-3"><summary class="fw-semibold">الأبحاث المحفوظة</summary><div id="saved" class="mt-2"></div></details>
  <div id="active" class="d-flex flex-wrap gap-2 mb-3"></div>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2"><div id="count" class="fw-semibold"></div>
    <select id="sort" class="form-select w-auto" aria-label="الترتيب"></select></div>
  <div class="row g-3" id="list"></div>
  <p id="note" class="text-muted small text-center mt-3"></p>
  <div class="text-center"><button id="more" class="btn btn-outline-secondary" hidden>متابعة البحث</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/search.js"></script>
</body>
</html>
