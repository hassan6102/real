<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبات العملاء - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body class="booting">
<main id="page-content" hidden>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="page-title">طلبات العملاء العقارية</h1>
    <a class="btn btn-gold" href="customers.html"><i class="bi bi-people ms-1"></i>إدارة العملاء وإضافة طلب</a>
  </div>

  <div class="fsec mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-lg-4">
        <input type="search" id="qInput" class="form-control" placeholder="بحث باسم العميل، الهاتف، المدينة، الكود..." autocomplete="off">
      </div>
      <div class="col-6 col-lg-2">
        <select id="txFilter" class="form-select"><option value="">كل العمليات</option></select>
      </div>
      <div class="col-6 col-lg-2">
        <select id="typeFilter" class="form-select"><option value="">كل العقارات</option></select>
      </div>
      <div class="col-6 col-lg-2">
        <select id="statusFilter" class="form-select"><option value="">كل الحالات</option></select>
      </div>
      <div class="col-6 col-lg-2">
        <button id="resetBtn" type="button" class="btn btn-outline-secondary w-100">إعادة ضبط</button>
      </div>
    </div>
  </div>

  <div id="count" class="text-muted small mb-2"></div>
  <div id="list"><div class="text-muted">جارٍ تحميل الطلبات...</div></div>
  <div class="text-center mt-4">
    <button id="more" class="btn btn-outline-secondary" hidden>تحميل المزيد</button>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/requests.js"></script>
</body>
</html>
