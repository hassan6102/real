<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="booting">
<main id="page-content" hidden>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title" id="hello">الرئيسية</h1>
    <button id="refresh" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise ms-1"></i>تحديث الأرقام</button>
  </div>
  <div id="stats-error" class="alert alert-warning" hidden>تعذّر تحميل الإحصائيات. تحقق من الاتصال وصلاحيات قاعدة البيانات.</div>
  <div class="row g-3 mb-4" id="stats"></div>
  <div class="row g-3">
    <div class="col-lg-6"><section class="panel"><h2>آخر النشاطات</h2><ul id="activity" class="feed"><li class="text-muted">جارٍ التحميل...</li></ul></section></div>
    <div class="col-lg-6"><section class="panel"><h2>آخر العقارات المضافة</h2><ul id="recent" class="feed"><li class="text-muted">جارٍ التحميل...</li></ul></section></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
