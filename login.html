<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<main class="login-wrap">
  <form id="form" class="login-card" novalidate>
    <div class="text-center mb-4"><i class="bi bi-building brand"></i><h1 class="h4 fw-bold mt-2 mb-1">إدارة العقارات</h1><p class="text-muted small mb-0">دخول أعضاء الفريق فقط</p></div>
    <div id="error" class="alert alert-danger py-2 small" role="alert" hidden></div>
    <div class="mb-3"><label class="form-label" for="id">رقم الهاتف أو البريد الإلكتروني</label>
      <input id="id" class="form-control form-control-lg" autocomplete="username" inputmode="email" dir="ltr" required></div>
    <div class="mb-4"><label class="form-label" for="pw">كلمة المرور</label>
      <div class="input-group"><input id="pw" type="password" class="form-control form-control-lg" autocomplete="current-password" dir="ltr" required>
      <button type="button" id="toggle" class="btn btn-outline-secondary" aria-label="إظهار كلمة المرور"><i class="bi bi-eye"></i></button></div></div>
    <button id="submit" class="btn btn-navy btn-lg w-100"><span class="spinner-border spinner-border-sm ms-2" hidden></span>تسجيل الدخول</button>
  </form>
</main>
<script type="module">
import { auth, onAuthStateChanged } from './js/firebase-config.js';
import { login, authMessage } from './js/auth.js';
const $ = s => document.querySelector(s);
const err = $('#error'), btn = $('#submit'), spin = btn.querySelector('.spinner-border');
$('#toggle').onclick = () => { const s = $('#pw'), show = s.type === 'password'; s.type = show ? 'text' : 'password'; $('#toggle i').className = `bi bi-eye${show ? '-slash' : ''}`; };
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (btn.disabled) return;
  const idv = $('#id').value.trim(), pw = $('#pw').value;
  err.hidden = true;
  if (!idv || !pw) { err.textContent = 'أدخل رقم الهاتف أو البريد وكلمة المرور.'; err.hidden = false; return; }
  btn.disabled = true; spin.hidden = false;
  try { await login(idv, pw); location.replace('dashboard.html'); }
  catch (ex) { err.textContent = authMessage(ex); err.hidden = false; btn.disabled = false; spin.hidden = true; }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
